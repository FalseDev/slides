        function pageInIframe() {
            return (window.location !== window.parent.location);
        }

        let forgetPop = true;
        function onPopState(event) {
            if(forgetPop){
                forgetPop = false;
            } else if( pageInIframe()) {
                parent.postMessage(event.target.location.href, "app://obsidian.md");
            }
        }
        window.onpopstate = onPopState;
        window.onmessage = event => {
            if(event.data == "reload"){
                window.document.location.reload();
            }
            forgetPop = true;
        }

        function fitElements() {
            const itemsToFit = document.getElementsByClassName('fitText');
            for (const item in itemsToFit) {
                if (Object.hasOwnProperty.call(itemsToFit, item)) {
                    const element = itemsToFit[item];
                    fitElement(element, 1, 1000);
                    element.classList.remove('fitText');
                }
            }
        }

        function fitElement(element, start, end) {

            let size = (end + start) / 2;
            element.style.fontSize = `${size}px`;

            if (Math.abs(start - end) < 1) {
                while (element.scrollHeight > element.offsetHeight) {
                    size--;
                    element.style.fontSize = `${size}px`;
                }
                return;
            }

            if (element.scrollHeight > element.offsetHeight) {
                fitElement(element, start, size);
            } else {
                fitElement(element, size, end);
            }
        }


        document.onreadystatechange = () => {
            fitElements();
            if (document.readyState === 'complete') {
                if (pageInIframe() && window.location.href.indexOf("?export") != -1){
                    parent.postMessage(event.target.location.href, "app://obsidian.md");
                }
                if (window.location.href.indexOf("print-pdf") != -1){
                    let stateCheck = setInterval(() => {
                        clearInterval(stateCheck);
                        window.print();
                    }, 250);
                }
            }
        };

### **What is NumPy?**

- **Definition:**
  - NumPy stands for Numerical Python.
  - It is a fundamental package for scientific computing with Python.
- **Core Features:**
  - Provides support for arrays and matrices, along with a collection of mathematical functions to operate on these data structures.
  - Efficient operations on large datasets.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### **Why Use NumPy?**

- **Performance:**
  - NumPy is implemented in C, allowing for fast and efficient computations.
- **Convenience:**
  - Easy-to-use syntax and powerful features like broadcasting, which simplifies many operations.
- **Integration:**
  - Works well with other libraries like SciPy, Pandas, and Matplotlib.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->

### **Basic Concepts**

- **Arrays:**
  - Central data structure in NumPy.
  - Can be 1D, 2D, or N-Dimensional.
- **Data Types:**
  - NumPy arrays have a specific data type, like `int`, `float`, or `complex`.
- **Operations:**
  - Element-wise operations: addition, subtraction, multiplication, etc.
  - Matrix operations: dot product, transpose, etc.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->

### **Creating NumPy Arrays**

- **From Lists:**

  ```python
  import numpy as np
  array1 = np.array([1, 2, 3])
  ```

- **Using Functions:**
  - `np.zeros((3,3))` - Creates an array of zeros.
  - `np.ones((2,2))` - Creates an array of ones.
  - `np.arange(0, 10, 2)` - Creates an array with a range of values.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->

### **Array Indexing and Slicing**

- **Indexing:**
  - Access elements using square brackets: `array1[0]` returns the first element.
- **Slicing:**
  - Extract a subset of an array: `array1[0:2]` returns the first two elements.
- **Advanced Indexing:**
  - Boolean indexing, integer array indexing for more complex operations.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->

### **Broadcasting**

- **Definition:**
  - A method that NumPy uses to allow arithmetic operations on arrays of different shapes.
- **Example:**

  ```python
  a = np.array([1, 2, 3])
  b = np.array([4])
  result = a + b  # [5, 6, 7]
  ```

### **What is Pandas?**

- **Definition:**
  - Pandas is an open-source Python library for data manipulation and analysis.
- **Core Features:**
  - Provides data structures like Series and DataFrame for handling and analyzing structured data.
- **Integration:**
  - Works seamlessly with other libraries like NumPy, Matplotlib, and SciPy.

### **Why Use Pandas?**

- **Efficiency:**
  - Optimized for fast data manipulation with large datasets.
- **Ease of Use:**
  - Intuitive syntax for data filtering, grouping, and aggregation.
- **Powerful Functionality:**
  - Handles missing data, merges/joining of datasets, and time-series functionality.

### **Core Data Structures**

- **Series:**
  - A one-dimensional labeled array capable of holding any data type.
  - Similar to a column in a spreadsheet or a SQL table.
- **DataFrame:**
  - A two-dimensional labeled data structure with columns of potentially different types.
  - Can be thought of as a collection of Series objects.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->

### **Creating a Pandas Series**

- **From a List:**

  ```python
  import pandas as pd
  s = pd.Series([1, 3, 5, 7])
  ```

- **From a Dictionary:**

  ```python
  data = {'a': 1, 'b': 2, 'c': 3}
  s = pd.Series(data)
  ```

  ```python
  data = {'Name': ['Alice', 'Bob', 'Charlie'], 'Age': [25, 30, 35]}

  ```

### **DataFrame Operations**

- **Basic Operations:**
  - `df.head()`: View the first few rows of the DataFrame.
  - `df.describe()`: Generate descriptive statistics.
- **Indexing and Selecting Data:**
  - `df['column_name']`: Select a single column.
  - `df.iloc[0]`: Select the first row.

### **Handling Missing Data**

- **Checking for Missing Data:**
  - `df.isnull()`: Detect missing values.
  - `df.dropna()`: Remove rows with missing values.
- **Filling Missing Data:**
  - `df.fillna(value)`: Replace missing values with a specified value.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->

### **Data Grouping and Aggregation**

- **Grouping Data:**
  - `df.groupby('column_name')`: Group data by a specific column.
- **Aggregation Functions:**

  - `df.groupby('column_name').sum()`: Calculate the sum for each group.

        function extend() {
            const target = {};
            for (let i = 0; i < arguments.length; i++) {
                const source = arguments[i];
                for (const key in source) {
                    if (source.hasOwnProperty(key)) {
                        target[key] = source[key];
                    }
                }
            }
            return target;
        }

        function isLight(color) {
            let hex = color.replace('#', '');

            // convert #fff => #ffffff
            if (hex.length == 3) {
                hex = `${hex[0]}${hex[0]}${hex[1]}${hex[1]}${hex[2]}${hex[2]}`;
            }

            const c_r = parseInt(hex.substr(0, 2), 16);
            const c_g = parseInt(hex.substr(2, 2), 16);
            const c_b = parseInt(hex.substr(4, 2), 16);
            const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
            return brightness > 155;
        }

        const bgColor = getComputedStyle(document.documentElement).getPropertyValue('--r-background-color').trim();

        if (isLight(bgColor)) {
            document.body.classList.add('has-light-background');
